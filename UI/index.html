<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fused Status Window</title>
    <link rel="stylesheet" href="design.css">
    <link rel="stylesheet" href="stats.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
    <div class="main-layout-container">
        <div class="character-area">
            <div class="character-sprite-box">
                <div class="character-glow"></div>
                <div class="character-stage-base"></div>
                <img src="../images/theif.png" alt="Character" class="character-sprite">
            </div>
            <div class="character-name-container">
                <h2 class="character-name">NOVICE</h2>
            </div>
        </div>

        <div class="unified-status-panel">
            <div class="panel-tabs">
                <button class="tab-item active" onclick="switchTab(event, 'details-tab')">Details</button>
                <button class="tab-item" onclick="switchTab(event, 'stat-tab')">Stat</button>
                <button class="tab-item" onclick="switchTab(event, 'info-tab')">Info</button>
            </div>

            <div id="details-tab" class="status-content tab-pane active">
                <div class="vital-stats">
                    <div class="bar-row">
                        <div class="bar"><div class="hp-fill" style="width: 85%;"></div></div>
                        <input class="bar-text-input" readonly value="858 / 1,010">
                    </div>
                    <div class="bar-row">
                        <div class="bar" style="background: #e0e8f0;"><div class="sp-fill" style="width: 100%; height: 100%; background: #4090e0; border-radius: 10px;"></div></div>
                        <input class="bar-text-input" readonly value="100 / 100">
                    </div>
                </div>

                <div class="header">
                    <div>Base Level <input type="text" class="lvl-value-input" value="1"></div>
                    <div>Status Points <input type="text" class="status-value" value="42" readonly></div>
                </div>

                <div class="status-columns">
                    <div class="column">
                        <div class="table-row"><span>STR</span><button class="stat-btn minus">-</button><input type="text" class="stat-input" value="4"><button class="stat-btn plus">+</button></div>
                        <div class="table-row"><span>AGI</span><button class="stat-btn minus">-</button><input type="text" class="stat-input" value="1"><button class="stat-btn plus">+</button></div>
                        <div class="table-row"><span>VIT</span><button class="stat-btn minus">-</button><input type="text" class="stat-input" value="1"><button class="stat-btn plus">+</button></div>
                        <div class="table-row"><span>INT</span><button class="stat-btn minus">-</button><input type="text" class="stat-input" value="1"><button class="stat-btn plus">+</button></div>
                        <div class="table-row"><span>DEX</span><button class="stat-btn minus">-</button><input type="text" class="stat-input" value="1"><button class="stat-btn plus">+</button></div>
                        <div class="table-row"><span>LUK</span><button class="stat-btn minus">-</button><input type="text" class="stat-input" value="1"><button class="stat-btn plus">+</button></div>
                    </div>

                    <div class="column">
                        <div class="table-row"><span class="symbol">+ 0</span><span class="value">2</span></div>
                        <div class="table-row"><span class="symbol">+ 0</span><span class="value">2</span></div>
                        <div class="table-row"><span class="symbol">+ 0</span><span class="value">2</span></div>
                        <div class="table-row"><span class="symbol">+ 0</span><span class="value">2</span></div>
                        <div class="table-row"><span class="symbol">+ 0</span><span class="value">2</span></div>
                        <div class="table-row"><span class="symbol">+ 0</span><span class="value">2</span></div>
                    </div>

                    <div class="column">
                        <div class="table-row"><span>ATK</span><div class="dikit-group"><input readonly value="4"><span class="symbol">+</span><input readonly value="0"></div></div>
                        <div class="table-row"><span>MATK</span><div class="dikit-group"><input readonly value="1"><span class="symbol">~</span><input readonly value="1"></div></div>
                        <div class="table-row"><span>HIT</span><div class="dikit-group"><input readonly value="2"></div></div>
                        <div class="table-row"><span>CRIT</span><div class="dikit-group"><input readonly value="1"></div></div>
                        <div class="table-row"><span>DEF</span><div class="dikit-group"><input readonly value="0"><span class="symbol">+</span><input readonly value="1"></div></div>
                        <div class="table-row"><span>MDEF</span><div class="dikit-group"><input readonly value="0"><span class="symbol">+</span><input readonly value="1"></div></div>
                        <div class="table-row"><span>FLEE</span><div class="dikit-group"><input readonly value="2"><span class="symbol">+</span><input readonly value="1"></div></div>
                        <div class="table-row" style="background: rgba(245,166,35,0.1); border-radius: 4px;"><span>ASPD</span><div class="dikit-group"><input readonly value="150" style="color: var(--orange-text);"></div></div>
                    </div>
                </div>
    <script>
        function switchTab(evt, tabId) {
            // Hide all tab panes
            const panes = document.querySelectorAll('.tab-pane');
            panes.forEach(pane => pane.classList.remove('active'));

            // Deactivate all tab buttons
            const buttons = document.querySelectorAll('.tab-item');
            buttons.forEach(btn => btn.classList.remove('active'));

            // Show current tab and activate button
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
    </script>

    <script src="../Stats/combat.js"></script>
    <script src="../Stats/stats.js"></script>
</body>
</html>
