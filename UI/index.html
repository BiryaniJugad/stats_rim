<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Status Window</title>
  <link rel="stylesheet" href="stats.css">
  <link rel="stylesheet" href="design.css">
  <link rel="stylesheet" href="bg.css">

</head>
<body>

  <div class="unified-status-panel">
    
    <div class="character-side">
       <img src="your-character.gif" alt="Character Design" class="rotating-char">
    </div>

    <div class="status-content">
      
      <div class="vital-stats">
        <div class="bar-row">
          <div class="bar"><div class="hp-fill"></div></div>
          <input class="bar-text-input" readonly value="100 / 100">
        </div>
      </div>
      
      <div class="header">
        <div>Base Level <input type="text" class="lvl-value-input" value="1"></div>
        <div>Status Points <input type="text" class="status-value" value="0" readonly></div>
      </div>

      <div class="status-columns">
        <div class="column">
          <div class="table-row"><span>STR</span><button class="stat-btn minus">-</button><input type="text" class="stat-input" value="1"><button class="stat-btn plus">+</button></div>
          <div class="table-row"><span>AGI</span><button class="stat-btn minus">-</button><input type="text" class="stat-input" value="1"><button class="stat-btn plus">+</button></div>
          <div class="table-row"><span>VIT</span><button class="stat-btn minus">-</button><input type="text" class="stat-input" value="1"><button class="stat-btn plus">+</button></div>
          <div class="table-row"><span>INT</span><button class="stat-btn minus">-</button><input type="text" class="stat-input" value="1"><button class="stat-btn plus">+</button></div>
          <div class="table-row"><span>DEX</span><button class="stat-btn minus">-</button><input type="text" class="stat-input" value="1"><button class="stat-btn plus">+</button></div>
          <div class="table-row"><span>LUK</span><button class="stat-btn minus">-</button><input type="text" class="stat-input" value="1"><button class="stat-btn plus">+</button></div>
        </div>

        <div class="column">
          <div class="table-row"><span>ATK</span><div class="dikit-group"><input readonly value="1"><span class="symbol">+</span><input readonly value="0"></div></div>
          <div class="table-row"><span>MATK</span><div class="dikit-group"><input readonly value="1"><span class="symbol">~</span><input readonly value="1"></div></div>
          <div class="table-row"><span>HIT</span><div class="dikit-group"><input readonly value="2"></div></div>
          <div class="table-row"><span>CRIT</span><div class="dikit-group"><input readonly value="1"></div></div>
          
          <div class="table-row">
            <span>DEF</span>
            <div class="dikit-group">
              <input readonly value="0"> <span class="symbol">+</span>
              <input readonly value="1"> </div>
          </div>

          <div class="table-row">
            <span>MDEF</span>
            <div class="dikit-group">
              <input readonly value="0"> <span class="symbol">+</span>
              <input readonly value="1"> </div>
          </div>

          <div class="table-row"><span>FLEE</span><div class="dikit-group"><input readonly value="2"><span class="symbol">+</span><input readonly value="1"></div></div>
          <div class="table-row"><span>ASPD</span><div class="dikit-group"><input readonly value="150"></div></div>
        </div>

        <div class="column">
          <div class="table-row"><span>Cost</span><span class="value">2</span></div>
          <div class="table-row"><span>Cost</span><span class="value">2</span></div>
          <div class="table-row"><span>Cost</span><span class="value">2</span></div>
          <div class="table-row"><span>Cost</span><span class="value">2</span></div>
          <div class="table-row"><span>Cost</span><span class="value">2</span></div>
          <div class="table-row"><span>Cost</span><span class="value">2</span></div>
        </div>
      </div>
    </div> 
  </div>

  <script src="../Stats/combat.js"></script>
  <script src="../Stats/stats.js"></script>
</body>
</html>
