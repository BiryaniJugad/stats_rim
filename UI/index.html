<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fused Status Window</title>
    <link rel="stylesheet" href="design.css">
    <link rel="stylesheet" href="stats.css">    
</head>
<body>
    <!-- header -->
    <div class="main-wrapper">
        <div class="glass-container">
            <header class="hud-header-block">
                <div class="hud-top-row">
                    <div class="hud-item"><span class="lbl">Job:</span>
                        <select name="classes" class="job-select">
                            <option value="">Novice</option>
                            <option value="1">Swordsman</option>
                            <option value="2">Magician</option>
                            <option value="3">Archer</option>
                            <option value="4">Acolyte</option>
                            <option value="5">Merchant</option>
                            <option value="6">Thief</option>
                        </select>
                    </div>
                    <div class="hud-item"><span class="lbl">TK Ranker?</span> <input type="checkbox"></div>
                    <div class="hud-item"><span class="lbl">Base Level:</span> <input type="number" id="base-level" value="1" class="small-input"></div>
                    <div class="hud-item">
                        <span>Job Level</span>
                        <select name="levels" class="level-select">
                            <option value="">-Level-</option>
                            <option value="1">Level 1</option>
                            <option value="2">Level 2</option>
                            <option value="3">Level 3</option>
                            <option value="4">Level 4</option>
                            <option value="5">Level 5</option>
                            <option value="6">Level 6</option>
                            <option value="7">Level 7</option>
                        </select>
                    </div>
                    <div class="hud-item"><span class="lbl">Weight:</span> <span class="val">2030</span></div>
                </div>
                <div class="hud-bottom-row">
                    <div class="vital-group">
                        <div class="vital-node">HP: <span class="val cyan">40</span></div>
                        <div class="vital-node">SP: <span class="val cyan">11</span></div>
                    </div>
                    <div class="bar-row">
                        <div class="bar" style="background: #e0e8f0;"><div class="sp-fill" style="width: 100%; height: 100%; background: #4090e0; border-radius: 10px;"></div></div>
                        <input class="bar-text-input" readonly value="100 / 100">
                    </div>
                </div>

                <div class="enhancement-row">
                    <div class="group-container">
                        <h3 class="label sub-label">Buffs</h3>
                        <div class="buffs-flex">
                            <div class="b-item">
                                <span>Blessings</span>
                                <select name="levels" class="level-select">
                                    <option value="">- Level -</option>
                                     <option value="1">Level 1</option>
                                     <option value="2">Level 2</option>
                                     <option value="3">Level 3</option>
                                     <option value="4">Level 4</option>
                                     <option value="5">Level 5</option>
                                     <option value="6">Level 6</option>
                                     <option value="7">Level 7</option>
                                     <option value="8">Level 8</option>
                                     <option value="9">Level 9</option>
                                     <option value="10">Level 10</option>
                                </select>
                            </div>
                            <div class="b-item">
                                <span>Increase AGI</span>
                                <select name="levels" class="level-select">
                                    <option value="">- Level -</option>
                                    <option value="1">Level 1</option>
                                    <option value="2">Level 2</option>
                                    <option value="3">Level 3</option>
                                    <option value="4">Level 4</option>
                                    <option value="5">Level 5</option>
                                    <option value="6">Level 6</option>
                                    <option value="7">Level 7</option>
                                    <option value="8">Level 8</option>
                                    <option value="9">Level 9</option>
                                    <option value="10">Level 10</option>
                                </select>
                            </div>
                            <div class="b-item">
                                <span>Angelus</span>
                                <select name="levels" class="level-select">
                                    <option value="">- Level -</option>
                                    <option value="1">Level 1</option>
                                    <option value="2">Level 2</option>
                                    <option value="3">Level 3</option>
                                    <option value="4">Level 4</option>
                                    <option value="5">Level 5</option>
                                    <option value="6">Level 6</option>
                                    <option value="7">Level 7</option>
                                    <option value="8">Level 8</option>
                                    <option value="9">Level 9</option>
                                    <option value="10">Level 10</option>
                                </select>
                            </div>
                            <div class="b-item">
                                <span>Impositio Manus</span>
                                <select name="levels" class="level-select">
                                    <option value="">- Level -</option>
                                    <option value="1">Level 1</option>
                                    <option value="2">Level 2</option>
                                    <option value="3">Level 3</option>
                                    <option value="4">Level 4</option>
                                    <option value="5">Level 5</option>
                                </select>
                            </div>
                            <div class="b-item">
                                <span>Wind Walk</span>
                                <select name="levels" class="level-select">
                                    <option value="">- Level -</option>
                                    <option value="1">Level 1</option>
                                    <option value="2">Level 2</option>
                                    <option value="3">Level 3</option>
                                    <option value="4">Level 4</option>
                                    <option value="5">Level 5</option>
                                    <option value="6">Level 6</option>
                                    <option value="7">Level 7</option>
                                    <option value="8">Level 8</option>
                                    <option value="9">Level 9</option>
                                    <option value="10">Level 10</option>
                                </select>
                            </div>
                            <div class="b-item"><span>Gloria?</span> <input type="checkbox"></div>
                        </div>
                    </div>

                    <div class="active-enhancements">
                        <div class="items-group">
                            <h4 class="sub-label">ITEMS</h4>
                            <div class="items-row">
                                <div class="b-item">
                                    <span>SPEED POTIONS</span>
                                    <select name="levels" class="level-select">
                                        <option value="">- Potion Type -</option>
                                        <option value="1">Concentration Potion</option>
                                        <option value="2">Awakening Potion</option>
                                        <option value="3">Berserk Potion</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- body -->
            </section>
            <div class="content-grid">  
                <div class="stats-box">
                    <h3 class="label">Attributes</h3>
                    <div class="stat-row"><span>STR</span> <input type="number" class="stat-input" value="1"> <span class="bonus">+0</span> <span class="req">2</span></div>
                    <div class="stat-row"><span>AGI</span> <input type="number" class="stat-input" value="1"> <span class="bonus">+0</span> <span class="req">2</span></div>
                    <div class="stat-row"><span>VIT</span> <input type="number" class="stat-input" value="1"> <span class="bonus">+0</span> <span class="req">2</span></div>
                    <div class="stat-row"><span>INT</span> <input type="number" class="stat-input" value="1"> <span class="bonus">+0</span> <span class="req">2</span></div>
                    <div class="stat-row"><span>DEX</span> <input type="number" class="stat-input" value="1"> <span class="bonus">+0</span> <span class="req">2</span></div>
                    <div class="stat-row"><span>LUK</span> <input type="number" class="stat-input" value="1"> <span class="bonus">+0</span> <span class="req">2</span></div>
                    <div class="weapon-selector">
                        <span class="label">Weapon Type</span>
                        <div class="weapon-row">
                            <span>Right:</span>
                            <select><option>Hand</option></select>
                        </div>
                    </div>

                    <div class="column">
                        <div class="table-row"><span>ATK</span><div class="dikit-group"><input readonly value="4"><span class="symbol">+</span><input readonly value="0"></div></div>
                        <div class="table-row"><span>MATK</span><div class="dikit-group"><input readonly value="1"><span class="symbol">~</span><input readonly value="1"></div></div>
                        <div class="table-row"><span>HIT</span><div class="dikit-group"><input readonly value="2"></div></div>
                        <div class="table-row"><span>CRIT</span><div class="dikit-group"><input readonly value="1"></div></div>
                        <div class="table-row"><span>DEF</span><div class="dikit-group"><input readonly value="0"><span class="symbol">+</span><input readonly value="1"></div></div>
                        <div class="table-row"><span>MDEF</span><div class="dikit-group"><input readonly value="0"><span class="symbol">+</span><input readonly value="1"></div></div>
                        <div class="table-row"><span>FLEE</span><div class="dikit-group"><input readonly value="2"><span class="symbol">+</span><input readonly value="1"></div></div>
                        <div class="table-row" style="background: rgba(245,166,35,0.1); border-radius: 4px;"><span>ASPD</span><div class="dikit-group"><input readonly value="150" style="color: var(--orange-text);"></div></div>
                    </div>
                </div>
            </div>
        <!-- footer side/status --> <!--gi comment nako kay basin OE si sir-->

            <h3 class="label">Status Change Resistances</h3>
            <div class="res-row">
                <div class="res-item">STUN<span>4%</span></div>
                <div class="res-item">POISON<span>4%</span></div>
                <div class="res-item">SILENCE<span>4%</span></div>
                <div class="res-item">BLEEDING<span>4%</span></div>
                <div class="res-item">SLEEP<span>4%</span></div>
                <div class="res-item">STONE COURSE<span>4%</span></div>
                <div class="res-item">FREEZE<span>4%</span></div>
                <div class="res-item">CURSE<span>4%</span></div>
                <div class="res-item">BLIND<span>4%</span></div>
                <div class="res-item">CONFUSION<span>4%</span></div>
            </div>
        </footer> -->
    </div>
    </div>

    <script src="../Stats/HPCalc.js" defer></script>
    <script src="../Stats/aspd.js" defer></script>
    <script src="../Stats/combat.js" defer></script>
    <script src="../Stats/stats.js" defer></script>
</body>
</html>
